[package]
name = "ibis-agent"
description = "Edits for an AI agent: a summary of a presentation, a document or a workbook with ids, a small set of operations in JSON for each turned into editing commands, and a check that the result can be saved. UI-independent, so the browser version and a command-line tool share it."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ibis-doc-model.workspace = true
ibis-pptx.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "ibis-agent"
path = "src/bin/ibis-agent.rs"
